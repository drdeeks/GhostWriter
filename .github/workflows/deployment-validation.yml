name: Deployment Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install
      
      - name: Validate environment
        run: node scripts/deployment/validation/validate-env.js
      
      - name: Check dependencies
        run: node scripts/deployment/validation/check-dependencies.js
      
      - name: Run contract tests
        run: npm run test
      
      - name: Run frontend tests
        run: npm run test:frontend