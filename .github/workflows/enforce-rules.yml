name: Enforce Deployment Rules

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-environment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run validate:env

  check-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run check:dependencies

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run test:all
      - run: npm run lint
      - run: npm run ts-check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm audit --production
      - run: npx slither . || echo "Slither analysis completed with warnings"

  enforce-rules:
    needs: [validate-environment, check-dependencies, test, build, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Deployment Checklist Compliance
        run: |
          echo "🔍 Checking deployment checklist compliance..."
          
          # Check if deployment checklist exists
          if [ ! -f "DEPLOYMENT_CHECKLIST.md" ]; then
            echo "❌ DEPLOYMENT_CHECKLIST.md not found"
            exit 1
          fi
          
          # Check for required scripts
          REQUIRED_SCRIPTS=("validate-env.js" "check-dependencies.js" "rollback-contracts.js")
          for script in "${REQUIRED_SCRIPTS[@]}"; do
            if [ ! -f "scripts/$script" ]; then
              echo "❌ Required script not found: scripts/$script"
              exit 1
            fi
          done
          
          echo "✅ All deployment rules enforcement checks passed"